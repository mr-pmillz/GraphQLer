name: Publish fork artifacts
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'mr-pmillz/GraphQLer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12.15'
      - run: uv sync --locked --extra mcp
      - run: uv run --locked --extra mcp pytest tests/unit/ -q
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os, re, tomllib
          tag = os.environ['RELEASE_TAG']
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) or tag != 'v' + version:
              raise SystemExit('Release tag must be v<project.version>')
          PYTHON
      - run: uv build --build-constraints build-constraints.txt --require-hashes
      - name: Export hashed runtime dependencies
        run: uv export --locked --no-dev --extra mcp --no-emit-project --format requirements-txt --output-file dist/requirements.txt --quiet
      - name: Hash distribution artifacts
        working-directory: dist
        run: sha256sum *.whl *.tar.gz requirements.txt > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/mr-pmillz/graphqler
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_SHA"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing=$(mktemp -d "$RUNNER_TEMP/graphqler-release.XXXXXXXX")
            gh release download "$RELEASE_TAG" --dir "$existing"
            for asset in dist/*; do
              if ! cmp --silent -- "$asset" "$existing/${asset##*/}"; then
                echo 'Existing release assets differ; publish changes under a new version.' >&2
                exit 1
              fi
            done
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --target "$EXPECTED_SHA" --generate-notes --title "$RELEASE_TAG"
          fi
