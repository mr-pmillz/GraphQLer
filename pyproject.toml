[project]
name = "GraphQLer"
dynamic = ["version"]
description = "A cutting edge context aware GraphQL API fuzzing tool!"
authors = [{ name = "Omar2535", email = "omar@9tsai.ca" }]
maintainers = [{ name = "mr-pmillz" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
dependencies = [
    "requests==2.34.2",
    "urllib3==2.8.0",
    "graphql-core==3.3.0",
    "pyyaml==6.0.3",
    "levenshtein==0.27.5",
    "clairvoyance==2.5.5",
    "cloudpickle==3.1.2",
    "matplotlib==3.11.2",
    "networkx==3.7",
    "litellm==1.106.2",
    "websockets==17.3",
    # Newer Textual requires Rich >=14; clairvoyance still requires Rich <14.
    "textual==6.2.1",
]

[project.urls]
Repository = "https://github.com/mr-pmillz/GraphQLer"
Issues = "https://github.com/mr-pmillz/GraphQLer/issues"
Documentation = "https://mr-pmillz.github.io/GraphQLer/"

[project.optional-dependencies]
mcp = ["mcp==2.3.0", "fastmcp==4.1.3"]

[project.scripts]
graphqler = "graphqler.__main__:cli"
graphqler-mcp = "graphqler.utils.mcp_utils.server:serve"

[tool.ruff]
line-length = 180

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "autopep8==2.3.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pytest-xdist==3.8.0",
    "flake8==7.4.1",
    "pre-commit==4.7.0",
    "ruff==0.17.2",
    "lark==1.3.1",
    "ty==0.0.91",
]
docs = [
    "zensical==0.0.71",
]

[tool.ty.src]
exclude = ["sample-graphql-apis/"]

[tool.uv]
package = true
cache-keys = [{ file = "pyproject.toml" }, { file = ".git_archival.txt" }, { git = { commit = true, tags = true } }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*"

[tool.hatch.build.hooks.vcs]
version-file = "graphqler/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/graphqler", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE",
    "/build-requirements.txt", "/build-constraints.txt", "/.git_archival.txt", "/.gitattributes",
]

[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0", "setuptools-scm==10.3.4"]
build-backend = "hatchling.build"
